name: lexiconnect

services:
  backend:
    image: ghcr.io/devthenu/lexiconnect-backend:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    expose:
      - "8000"
    volumes:
      - ../uploads:/app/uploads
    command: >
      sh -c "mkdir -p /app/uploads &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/devthenu/lexiconnect-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  appnet:
    driver: bridge
