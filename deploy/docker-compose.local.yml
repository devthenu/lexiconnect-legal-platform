services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexiconnect}
      POSTGRES_USER: ${POSTGRES_USER:-lexiconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexiconnect} -d ${POSTGRES_DB:-lexiconnect}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-lexiconnect}:${POSTGRES_PASSWORD:-change_me_local}@postgres:5432/${POSTGRES_DB:-lexiconnect}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@lexiconnect.local}
      ENV: local
      DEBUG: "true"
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
            uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
